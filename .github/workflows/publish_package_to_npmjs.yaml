name: Publish Metascript to npmjs

on:
  workflow_dispatch:
    inputs:
      publish_env:
        description: Select the environment to publish to (production or alpha)
        type: choice
        required: true
        options:
          - production
          - alpha

jobs:
  publish_metascript:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Publish Metascript Package
      - name: Publish Metascript
        run: |
          if [ "${{ inputs.publish_env }}" == "alpha" ]; then
            PUBLISH_TAG="--tag alpha"
          else
            PUBLISH_TAG=""
          fi

          echo "Publishing metascript to ${{ inputs.publish_env }} environment"
          npm publish $PUBLISH_TAG
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
